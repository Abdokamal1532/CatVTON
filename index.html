<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WearCast — Easy Virtual Try-On</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508;
    --card: #11111a;
    --accent: #7c6bf0;
    --text: #ffffff;
    --muted: #888899;
    --border: #222233;
    --success: #4ecb87;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeInDown 0.6s ease;
  }

  h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  h1 span { color: var(--accent); }

  p.subtitle {
    color: var(--muted);
    font-size: 16px;
  }

  .main-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    width: 100%;
    max-width: 500px;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    animation: fadeInUp 0.6s ease;
  }

  .upload-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }

  .upload-box {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 20px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .upload-box:hover { border-color: var(--accent); background: rgba(124,107,240,0.05); }

  .upload-box img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 2;
  }

  .upload-icon { font-size: 24px; margin-bottom: 8px; z-index: 1; }
  .upload-text { font-size: 13px; color: var(--muted); z-index: 1; }

  .btn-tryon {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent) 0%, #9d8ff5 100%);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-tryon:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(124,107,240,0.3); }
  .btn-tryon:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  /* PROGRESS BAR */
  .progress-container {
    margin-top: 24px;
    display: none;
  }

  .progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 8px;
    color: var(--muted);
  }

  .progress-bar-track {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .time-estimate { color: var(--accent); font-weight: 600; }

  /* RESULT AREA */
  .result-area {
    margin-top: 32px;
    display: none;
    text-align: center;
    animation: fadeIn 0.8s ease;
  }

  .result-img-wrapper {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-top: 16px;
  }

  .result-img-wrapper img {
    width: 100%;
    display: block;
  }

  .badge-new {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--success);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

  footer {
    margin-top: auto;
    padding: 40px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  .step-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
    display: block;
    text-align: left;
  }
</style>
</head>
<body>

<header>
  <h1>Wear<span>Cast</span></h1>
  <p class="subtitle">Virtual try-on made incredibly simple.</p>
</header>

<div class="main-card">
  <span class="step-label">1. Upload Photos</span>
  <div class="upload-grid">
    <div class="upload-box" onclick="document.getElementById('pInput').click()" id="pBox">
      <div class="upload-icon">👤</div>
      <div class="upload-text">You</div>
      <input type="file" id="pInput" hidden accept="image/*" onchange="hPreview(this, 'pBox')">
    </div>
    <div class="upload-box" onclick="document.getElementById('gInput').click()" id="gBox">
      <div class="upload-icon">👕</div>
      <div class="upload-text">Cloth</div>
      <input type="file" id="gInput" hidden accept="image/*" onchange="hPreview(this, 'gBox')">
    </div>
  </div>

  <button class="btn-tryon" id="runBtn" onclick="run()">
    Start Try-On
  </button>

  <div class="progress-container" id="pContainer">
    <div class="progress-text">
      <span id="pStatus">Processing...</span>
      <span class="time-estimate" id="pTime">Est. 12s</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="pFill"></div>
    </div>
  </div>
</div>

<div class="result-area" id="rArea">
  <span class="step-label">2. Your Result</span>
  <div class="result-img-wrapper">
    <span class="badge-new">Perfect Fit</span>
    <img src="" id="rImg" alt="Result">
  </div>
  <button class="btn-tryon" style="margin-top:16px; background:#222; border:1px solid var(--border);" onclick="location.reload()">
    Try Another
  </button>
</div>

<footer>
  Powered by CatVTON AI · Stable Diffusion Pipeline
</footer>

<script>
  let pFile = null;
  let gFile = null;

  function hPreview(input, boxId) {
    const file = input.files[0];
    if (!file) return;
    if (boxId === 'pBox') pFile = file; else gFile = file;

    const reader = new FileReader();
    reader.onload = e => {
      const box = document.getElementById(boxId);
      const existingImg = box.querySelector('img');
      if (existingImg) existingImg.src = e.target.result;
      else {
        const img = document.createElement('img');
        img.src = e.target.result;
        box.appendChild(img);
      }
    };
    reader.readAsDataURL(file);
  }

  async function run() {
    if (!pFile || !gFile) {
      alert("Please upload both photos.");
      return;
    }

    const btn = document.getElementById('runBtn');
    const pBar = document.getElementById('pContainer');
    const pFill = document.getElementById('pFill');
    const pTime = document.getElementById('pTime');
    const pStatus = document.getElementById('pStatus');

    btn.disabled = true;
    pBar.style.display = 'block';

    const formData = new FormData();
    formData.append('person', pFile);
    formData.append('cloth', gFile);
    formData.append('cloth_type', 'upper');
    formData.append('steps', 30);
    formData.append('cfg', 2.5);
    formData.append('seed', Math.floor(Math.random() * 1000));

    // Progress simulation
    let progress = 0;
    let secondsLeft = 15;
    const interval = setInterval(() => {
      if (progress < 90) {
        progress += 5 + Math.random() * 5;
        if (progress > 90) progress = 90;
        pFill.style.width = progress + '%';
        
        if (secondsLeft > 1) {
            secondsLeft--;
            pTime.textContent = `Est. ${secondsLeft}s`;
        }
      }
      
      if (progress > 20) pStatus.textContent = "Warping garment...";
      if (progress > 50) pStatus.textContent = "Blending textures...";
      if (progress > 80) pStatus.textContent = "Final refining...";
    }, 800);

    try {
      const response = await fetch('/api/tryon', {
        method: 'POST',
        body: formData
      });
      const data = await response.json();

      clearInterval(interval);
      if (data.status === 'success') {
        pFill.style.width = '100%';
        pTime.textContent = "Finished!";
        pStatus.textContent = "Complete";
        
        setTimeout(() => {
          document.getElementById('rImg').src = data.result_url;
          document.getElementById('rArea').style.display = 'block';
          document.querySelector('.main-card').style.opacity = '0.5';
          document.querySelector('.main-card').style.pointerEvents = 'none';
          window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
        }, 500);
      } else {
        alert("Try-on failed: " + data.message);
        btn.disabled = false;
      }
    } catch (e) {
      clearInterval(interval);
      alert("Error connecting to server.");
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
